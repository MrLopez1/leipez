<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Science Fair · Live Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap sf sf-live">
  <header class="top">
    <div>
      <p class="brand">Science &amp; STEAM Fair <span class="hl">Live Results</span></p>
      <p class="sub" id="fairName"></p>
    </div>
    <div class="who-tag"><span class="sf-dot" id="liveDot"></span><span id="updated"></span></div>
  </header>

  <section id="r-setup" hidden class="narrow"><div class="note bad">This site isn't connected to the database yet (js/config.js).</div></section>
  <section id="r-loading" class="narrow"><p class="sub">Loading the results…</p></section>
  <section id="r-msg" hidden class="narrow"><div class="panel stack"><h1 id="msgTitle"></h1><p class="sub" id="msgText"></p></div></section>

  <section id="r-main" hidden>
    <div class="stack">
      <div class="panel sf-progress">
        <div class="sf-progress-head"><div><span class="label">Judging progress</span><p class="sf-progress-big"><b class="num" id="pDone">0</b> of <b class="num" id="pAll">0</b> projects judged</p></div>
        <div class="statchips" id="pChips"></div></div>
        <div class="sf-meter" aria-hidden="true"><i id="pBar"></i><i id="pBar2" class="soft"></i></div>
        <p class="sub" id="pState"></p>
      </div>
      <div class="sf-divs" id="divs"></div>
    </div>
  </section>
</div>
<script>
/* If the page gets stuck, say why instead of showing "Loading…" forever. */
(function () {
  var box = "r-loading";
  window.__elShow = function (html) { window.__elShown = true; var el = document.getElementById(box); if (el) { el.hidden = false; el.innerHTML = '<div class="note bad">' + html + '</div>'; } };
  window.addEventListener("error", function (e) {
    if (window.__elReady) return;
    var t = e.target;
    if (t && t.tagName === "SCRIPT") {
      __elShow("Checking which file is missing…");
      // The browser blames the page's main script when ANY file it needs is missing, so test each one.
      var V = "https://www.gstatic.com/firebasejs/12.18.0/";
      var files = ["js/fair-results.js", "js/fair-config.js", "js/fair-core.js", "js/fb.js", "js/ui.js", "js/config.js", V + "firebase-app.js", V + "firebase-auth.js", V + "firebase-database.js"];
      Promise.all(files.map(function (f) {
        return fetch(f, { cache: "no-store" }).then(function (r) { return [f, r.ok]; }, function () { return [f, false]; });
      })).then(function (res) {
        var bad = res.filter(function (x) { return !x[1]; });
        var list = res.map(function (x) { return "<li>" + (x[1] ? "✓ " : "<b>✗ ") + x[0].replace(V, "Firebase: ") + (x[1] ? "" : " (missing)</b>") + "</li>"; }).join("");
        __elShow((bad.length ? "This page can't start because " + (bad.length === 1 ? "a file is" : "some files are") + " missing:" : "Every file loads now. Reload the page.") +
          "<ul style='margin:8px 0;padding-left:20px'>" + list + "</ul>" +
          (bad.some(function (x) { return x[0].indexOf(V) === 0; }) ? "Firebase's own files can't be reached from this network. Try another connection." : bad.length ? "On GitHub, the file must have exactly this name (lowercase, same spelling) inside the <b>js</b> folder, which sits next to this page. GitHub can take a minute or two to publish a new upload." : ""));
      });
    } else if (e.message) {
      __elShow("The page hit an error: <b>" + String(e.message).replace(/</g, "&lt;") + "</b>. This usually means a file on GitHub is an older version. Upload all the files from the latest zip again, then reload.");
    }
  }, true);
  setTimeout(function () {
    if (!window.__elReady && !window.__elShown) __elShow("Still not loaded after 20 seconds. Check the internet connection and that <b>js/config.js</b> on GitHub has your Firebase settings (including <b>databaseURL</b>), then reload.");
  }, 20000);
})();
</script>
<script type="module" src="js/fair-results.js"></script>
</body>
</html>
